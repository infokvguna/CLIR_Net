[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clirnet"
version = "1.0.0"
description = "CLIR-Net: Cross-Lingual Invariant Representation Network for Speech and Audio-Visual Emotion Recognition"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "CLIR-Net Research Team"}
]
keywords = [
    "emotion-recognition",
    "structural-causal-models",
    "causal-inference",
    "cross-lingual",
    "audio-visual",
    "speech-emotion-recognition",
    "deep-learning",
    "pytorch"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "data_loaders*", "preprocessing*", "training*", "scripts*"]
